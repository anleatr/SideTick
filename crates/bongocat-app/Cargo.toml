[package]
name = "bongocat-app"
version = "2.4.1"
edition = "2024"

[features]
production = []

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
atomic-write-file = "=0.3.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

